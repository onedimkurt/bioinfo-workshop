# Builds the small annotation files of the Day-3 afternoon (variant annotation in chr20:10-12 Mb) and adds
# them to the release data-v1 of this repository, with their own checksum list ANNOTATION.SHA256SUMS.
# The release's SHA256SUMS (the copy in the trainees' data/ folders) is never replaced.
#   chr20.ensembl116.gff3.gz            gene annotation of chromosome 20 (Ensembl 116 = GENCODE 50), renamed chr20
#   gnomad.genomes.v4.1.window.vcf.gz   gnomAD v4.1 genome allele frequencies in the window (PASS sites)
#   clinvar_<date>.window.vcf.gz        ClinVar records in the window (GRCh38), renamed chr20
# Started by a push that changes .github/data-annot-run.txt (the chat cannot press "Run workflow").
# The summary and the checksums go to the branch ci-status (status/data-annot/).
name: data-annot

on:
  push:
    branches: [main]
    paths: [".github/data-annot-run.txt"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: data-annot
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  WINDOW: "chr20:10000000-12000000"
  ENSEMBL: "116"
  GNOMAD: "4.1"

jobs:
  build:
    if: github.repository == 'onedimkurt/bioinfo-workshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/onedimkurt/bioinfo-workshop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reference (the trainees' chr20) and the GIAB window for a sanity check
        run: |
          set -euxo pipefail
          env=/opt/conda/envs/variants-ready/bin
          mkdir -p out log
          exec > >(tee -a log/trace-1-reference.log) 2>&1
          rel=https://github.com/onedimkurt/bioinfo-workshop/releases/download/data-v1
          curl -fsSL --retry 5 -o chr20.fa.gz "$rel/chr20.fa.gz"
          zcat chr20.fa.gz > chr20.fa
          $env/samtools faidx chr20.fa
          for f in NA12878_GIAB_v4.2.1_window.vcf.gz NA12878_GIAB_v4.2.1_window.vcf.gz.tbi; do curl -fsSL --retry 5 -o "$f" "$rel/$f"; done
      - name: Gene annotation (Ensembl GFF3 of chromosome 20, renamed chr20)
        run: |
          set -euxo pipefail
          env=/opt/conda/envs/variants-ready/bin
          exec > >(tee -a log/trace-2-gff.log) 2>&1
          curl -fsSL --retry 5 -o ens20.gff3.gz "https://ftp.ensembl.org/pub/release-${ENSEMBL}/gff3/homo_sapiens/Homo_sapiens.GRCh38.${ENSEMBL}.chromosome.20.gff3.gz"
          zcat ens20.gff3.gz | awk 'BEGIN { FS = OFS = "\t" }
            /^##sequence-region/ { sub(/sequence-region +20 /, "sequence-region   chr20 "); print; next }
            /^#/ { print; next }
            $1 == "20" { $1 = "chr20" } { print }' | $env/bgzip -c > out/chr20.ensembl${ENSEMBL}.gff3.gz
          # sanity check: bcftools csq must accept this file with the trainees' chr20 (fails the step if not)
          $env/bcftools csq -f chr20.fa -g out/chr20.ensembl${ENSEMBL}.gff3.gz -p a NA12878_GIAB_v4.2.1_window.vcf.gz -Oz -o csq_truth.vcf.gz 2> csq.err \
            || { cat csq.err; exit 1; }
          {
            set +o pipefail   # head/grep -m below may close a pipe early; this block only reports
            echo "== GFF3: $(zcat out/chr20.ensembl${ENSEMBL}.gff3.gz | grep -vc '^#') feature lines"
            zcat out/chr20.ensembl${ENSEMBL}.gff3.gz | grep '^#!' | head -3
            echo "== bcftools csq on the GIAB truth of the window (consequence counts)"
            $env/bcftools query -f '%INFO/BCSQ\n' csq_truth.vcf.gz | tr ',' '\n' | cut -d'|' -f1 | sort | uniq -c | sort -k1,1nr | head -25
            echo "csq stderr (first lines):"; head -5 csq.err
            echo "== genes with a protein-coding transcript in the window"
            zcat out/chr20.ensembl${ENSEMBL}.gff3.gz | awk -F'\t' '$3 == "gene" && $4 < 12000000 && $5 > 10000000' \
              | grep 'biotype=protein_coding' | sed -E 's/.*Name=([^;]+).*/\1/' | tr '\n' ' '; echo
            echo "== protein-altering consequences in the truth, by gene"
            $env/bcftools query -f '%INFO/BCSQ\n' csq_truth.vcf.gz | tr ',' '\n' | grep -E '^(missense|stop_gained|frameshift|inframe|splice_acceptor|splice_donor|start_lost|stop_lost)' \
              | cut -d'|' -f1,2 | sort | uniq -c | sort -k1,1nr | head -40
          } 2>&1 | tee log/gff.log
      - name: gnomAD v4.1 genome allele frequencies in the window (PASS sites)
        run: |
          set -euxo pipefail
          env=/opt/conda/envs/variants-ready/bin
          exec > >(tee -a log/trace-3-gnomad.log) 2>&1
          g="https://storage.googleapis.com/gcp-public-data--gnomad/release/${GNOMAD}/vcf/genomes/gnomad.genomes.v${GNOMAD}.sites.chr20.vcf.bgz"
          for attempt in 1 2 3; do $env/bcftools view -h "$g" > gnomad.header.txt && break; sleep 30; done
          keep=""
          for f in AC AN AF nhomalt grpmax AF_grpmax fafmax_faf95_max; do
            grep -q "^##INFO=<ID=$f," gnomad.header.txt && keep="${keep}INFO/$f,"
          done
          keep="${keep%,}"
          echo "kept INFO fields: $keep" | tee log/gnomad.log
          grep -E "^##INFO=<ID=($(echo "$keep" | sed 's#INFO/##g; s#,#|#g'))," gnomad.header.txt | tee -a log/gnomad.log
          for attempt in 1 2 3; do
            if $env/bcftools view -r "$WINDOW" -f PASS -i 'INFO/AC>0' -Ou "$g" \
                 | $env/bcftools annotate -x "^$keep" -Ou \
                 | $env/bcftools norm -f chr20.fa -m -any -Oz -o out/gnomad.genomes.v${GNOMAD}.window.vcf.gz; then break; fi
            sleep 60
          done
          $env/bcftools index -t out/gnomad.genomes.v${GNOMAD}.window.vcf.gz
          echo "gnomAD records in window: $($env/bcftools view -H out/gnomad.genomes.v${GNOMAD}.window.vcf.gz | wc -l)" | tee -a log/gnomad.log
          { set +o pipefail; $env/bcftools view -H out/gnomad.genomes.v${GNOMAD}.window.vcf.gz | head -3 | cut -c1-400; } | tee -a log/gnomad.log
          ls -l out | tee -a log/gnomad.log
      - name: ClinVar records in the window (GRCh38, renamed chr20)
        run: |
          set -euxo pipefail
          env=/opt/conda/envs/variants-ready/bin
          exec > >(tee -a log/trace-4-clinvar.log) 2>&1
          c=https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38
          curl -fsSL --retry 5 -o clinvar.vcf.gz "$c/clinvar.vcf.gz"
          curl -fsSL --retry 5 -o clinvar.vcf.gz.tbi "$c/clinvar.vcf.gz.tbi"
          $env/bcftools view -h clinvar.vcf.gz > clinvar.header.txt
          date=$(grep -m1 '^##fileDate' clinvar.header.txt | cut -d= -f2 | tr -d '-')
          test -n "$date"
          echo "ClinVar file date: $date" | tee log/clinvar.log
          grep -m3 -E '^##(source|reference)' clinvar.header.txt | tee -a log/clinvar.log || true
          start=${WINDOW#*:}; start=${start%-*}; end=${WINDOW#*-}
          len=$(cut -f2 chr20.fa.fai)
          # rename 20 -> chr20 and give the contig its length (the trainees' reference); keep the fields we teach
          $env/bcftools view -r "20:${start}-${end}" clinvar.vcf.gz \
            | awk -v len="$len" 'BEGIN { FS = OFS = "\t" }
                /^##contig=<ID=20[,>]/ { next }
                /^#CHROM/ { print "##contig=<ID=chr20,length=" len ">"; print; next }
                /^#/ { print; next }
                { $1 = "chr20"; print }' \
            | $env/bcftools annotate -x '^INFO/ALLELEID,INFO/CLNSIG,INFO/CLNREVSTAT,INFO/CLNDN,INFO/GENEINFO,INFO/MC,INFO/CLNVC,INFO/CLNHGVS' -Ou \
            | $env/bcftools norm -f chr20.fa -c w -m -any -Oz -o "out/clinvar_${date}.window.vcf.gz"
          $env/bcftools index -t "out/clinvar_${date}.window.vcf.gz"
          {
            set +o pipefail   # head below may close a pipe early; this block only reports
            echo "ClinVar records in window: $($env/bcftools view -H out/clinvar_${date}.window.vcf.gz | wc -l)"
            echo "by CLNSIG:"
            $env/bcftools query -f '%INFO/CLNSIG\n' "out/clinvar_${date}.window.vcf.gz" | sort | uniq -c | sort -k1,1nr | head -20
            echo "by gene (GENEINFO):"
            $env/bcftools query -f '%INFO/GENEINFO\n' "out/clinvar_${date}.window.vcf.gz" | cut -d: -f1 | sort | uniq -c | sort -k1,1nr | head -20
            echo "by review status (CLNREVSTAT):"
            $env/bcftools query -f '%INFO/CLNREVSTAT\n' "out/clinvar_${date}.window.vcf.gz" | sort | uniq -c | sort -k1,1nr | head -10
            $env/bcftools view -H "out/clinvar_${date}.window.vcf.gz" | head -3 | cut -c1-400
          } 2>&1 | tee -a log/clinvar.log
      - name: Checksums
        run: |
          set -euo pipefail
          cd out && sha256sum $(ls | grep -v SHA256SUMS) | sort -k2 > ANNOTATION.SHA256SUMS && cat ANNOTATION.SHA256SUMS && ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: annotation
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-annotation
          path: log/
          retention-days: 7

  publish:
    needs: build
    if: always() && github.repository == 'onedimkurt/bioinfo-workshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish the annotation files to data-v1 (never SHA256SUMS)
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l art/annotation
          test ! -e art/annotation/SHA256SUMS
          gh release upload data-v1 art/annotation/* --clobber
      - name: Status to the branch ci-status (status/data-annot/)
        if: always()
        run: |
          mkdir -p /tmp/st && cp art/log-annotation/*.log /tmp/st/ 2>/dev/null || true
          cp art/annotation/ANNOTATION.SHA256SUMS /tmp/st/ 2>/dev/null || true
          echo "run: ${{ github.run_id }} build: ${{ needs.build.result }}" > /tmp/st/STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git fetch -q origin ci-status; then git checkout -q -f -B ci-status FETCH_HEAD; else git checkout -q -f --orphan ci-status; fi
            rm -rf status/data-annot && mkdir -p status/data-annot && cp /tmp/st/* status/data-annot/
            git add status/data-annot && git commit -qm "data-annot run ${{ github.run_id }}" || true
            git push -q origin HEAD:refs/heads/ci-status && break
            sleep 5
          done
